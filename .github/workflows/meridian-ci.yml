name: meridian-ci
on:
  push:
    paths: ["meridian/**", ".github/workflows/meridian-ci.yml"]
  pull_request:
    paths: ["meridian/**", ".github/workflows/meridian-ci.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: meridian
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meridian_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meridian/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Generate job-local secret
        run: echo "APP_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx drizzle-kit push --force
      - run: npm run db:harden
      - name: UAT (exits non-zero on any failed check)
        run: npm run uat
        env:
          NODE_ENV: production
      - run: npm audit --omit=dev --audit-level=high
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image (no push)
        run: docker build -t meridian-app:ci meridian
      - name: Build tools image (no push)
        run: docker build --target tools -t meridian-tools:ci meridian
