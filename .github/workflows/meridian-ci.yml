name: meridian-ci
on:
  push:
    paths: ["meridian/**", ".github/workflows/meridian-ci.yml"]
  pull_request:
    paths: ["meridian/**", ".github/workflows/meridian-ci.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: meridian
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meridian_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meridian/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Generate job-local secret
        run: echo "APP_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx drizzle-kit push --force
      - run: npm run db:harden
      - name: Start app for HTTP UAT checks
        run: |
          (PORT=3000 HOSTNAME=127.0.0.1 nohup npm run start > app.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3000 && exit 0; sleep 1; done
          cat app.log; exit 1
        env:
          NODE_ENV: production
      - name: UAT (exits non-zero on any failed check)
        run: npm run uat
        env:
          NODE_ENV: production
          UAT_BASE_URL: http://127.0.0.1:3000
      - run: npm audit --omit=dev --audit-level=high
      - name: Build the MCP connector
        working-directory: meridian/mcp
        run: npm ci && npm run build
      - name: MCP smoke test (tools listed, forbidden names absent)
        working-directory: meridian/mcp
        run: npm run smoke
      - run: npm audit --omit=dev --audit-level=high
        working-directory: meridian/mcp
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image (no push)
        run: docker build -t meridian-app:ci .
      - name: Build tools image (no push)
        run: docker build --target tools -t meridian-tools:ci .
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: dummy
          APP_SECRET: dummydummydummydummydummydummydummydummy
          TUNNEL_TOKEN: dummy
        run: docker compose -f deploy/docker-compose.yml config -q
      - name: Validate Caddyfile
        env:
          MERIDIAN_IP: 172.30.0.10
        run: docker run --rm -e MERIDIAN_IP -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
