# Run from meridian/deploy:  docker compose --env-file .env up -d
name: meridian
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published: reachable only on the compose network.

  app:
    build:
      context: ..
    image: meridian-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-meridian_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-meridian}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in deploy/.env}
      TRUST_PROXY: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "127.0.0.1:3000:3000"   # host-local only (for health checks/debug); cloudflared uses http://app:3000

  migrate:
    profiles: ["setup"]
    build:
      context: ..
      target: tools
    image: meridian-tools:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-meridian_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-meridian}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in deploy/.env}
    # Default: schema push + audit-log hardening. Override for other tasks, e.g.
    #   docker compose --profile setup run --rm migrate npm run setup:passwords
    #   docker compose --profile setup run --rm migrate npm run uat

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - app

volumes:
  pgdata:
